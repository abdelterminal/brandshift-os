# BrandShift OS -- local-network deployment. Not Vercel. See DECISIONS.md.
#
#   cp .env.example .env   # then fill in POSTGRES_PASSWORD and JWT_SECRET
#   docker compose up -d --build

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Deterministic collation so ORDER BY name matches across machines.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    # Loopback only. The database is never reachable from the wider network;
    # the app container reaches it over the compose network instead.
    # DB_PORT only moves the host-side port -- useful when another Postgres
    # already holds 5432 on this machine. Keep DATABASE_URL in step with it.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Chromium cannot create its own Linux namespace sandbox under Docker's
    # default seccomp profile. Keep the container itself least-privileged
    # instead of granting SYS_ADMIN or disabling seccomp for the whole service.
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SESSION_TTL: ${SESSION_TTL:-7d}
    # APP_PORT only moves the host-side port; the container always listens on
    # 3000. Bound on all interfaces on purpose -- this is a LAN deployment.
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-data:
